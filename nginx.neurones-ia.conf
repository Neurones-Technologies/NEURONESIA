# ============================================================
#  Neurones IA — Nginx vhost
#  Accessible via :
#    - http://ia.neuronestech.com  (après config DNS)
#    - http://76.13.51.87:8080 (test direct par IP)
#  Sync + reload automatiques à chaque déploiement (.github/workflows/deploy.yml,
#  étape "Deploy via SSH") : ce fichier est scp'é vers le VPS puis copié dans
#  /etc/nginx/sites-available/neurones-ia, testé (nginx -t) et rechargé si valide
#  — sinon la config précédente est restaurée, sans reload. Commande manuelle
#  équivalente (dépannage uniquement) :
#    cp /opt/neurones-ia/nginx.neurones-ia.conf /etc/nginx/sites-available/neurones-ia
#    ln -sf /etc/nginx/sites-available/neurones-ia /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#
#  Routage /api/* — deux familles de routes distinctes sous le même préfixe :
#    - /api/copilot et /api/backend/*  : Route Handlers Next.js (server-side,
#      injectent le JWT httpOnly avant d'appeler FastAPI) → doivent atterrir
#      sur le FRONTEND (3001), jamais sur FastAPI directement. Prefix locations
#      nginx : le préfixe le plus long l'emporte, donc ces blocs priment sur
#      le catch-all /api/ ci-dessous quel que soit leur ordre dans le fichier.
#    - /api/v1/*  (webhooks Odoo, etc.) : appelé directement par des systèmes
#      externes (pas de passage par le navigateur) → proxy direct FastAPI,
#      avec réécriture qui retire le préfixe /api.
# ============================================================

# ─── Accès via DNS : ia.neuronestech.com (port 80) ─────────
server {
    listen 80;
    server_name ia.neuronestech.com;

    client_max_body_size 50M;

    # Route Handler Next.js (Sales IA / copilot) — AbortSignal.timeout(120s) côté route.ts.
    location /api/copilot {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    # Route Handler Next.js (proxy avant-vente + GED) — PROXY_TIMEOUT_MS = 600s côté route.ts.
    location /api/backend/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 610s;
        proxy_send_timeout 610s;
    }

    # Catch-all : appels DIRECTS à FastAPI (webhooks Odoo, etc. — pas de navigateur impliqué).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# ─── Accès direct IP : 76.13.51.87:8080 (test sans DNS) ─────
