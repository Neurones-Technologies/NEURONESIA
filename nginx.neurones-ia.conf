# ============================================================
#  Neurones IA — Nginx vhost
#  Accessible via :
#    - https://nt-cockpit.neuronestech.com  (voie officielle — DNS Gandi -> 76.13.51.87,
#      certificat Let's Encrypt posé le 2026-08-19, expire le 2026-11-17, renouvellement
#      automatique par la tâche planifiée certbot)
#    - http://76.13.51.87  (accès direct par IP — répond encore via le catch-all `_`,
#      en HTTP clair : le bloc 80 ne redirige en 301 que le host nt-cockpit)
#    - ia.neuronestech.com : nom conservé dans server_name mais son DNS résout
#      toujours vers 89.116.30.238, un AUTRE serveur (vérifié le 2026-08-19).
#
#  ATTENTION — les deux server blocks ci-dessous sont générés/complétés par Certbot
#  (`certbot --nginx -d nt-cockpit.neuronestech.com --redirect`). Le `listen 80` vit
#  désormais dans le SECOND bloc, celui qui fait la redirection HTTP -> HTTPS. Ne pas
#  réintroduire de `listen 80` dans le premier bloc et ne pas supprimer les lignes
#  `# managed by Certbot` : ce fichier écrase la config du VPS à chaque déploiement,
#  donc toute perte du bloc SSL ici fait silencieusement retomber le site en HTTP
#  clair (nginx ne renvoie aucune erreur — la panne est invisible).
#
#  Sync + reload automatiques à chaque déploiement (.github/workflows/deploy.yml,
#  étape "Deploy via SSH") : ce fichier est scp'é vers le VPS puis copié dans
#  /etc/nginx/sites-available/neurones-ia, testé (nginx -t) et rechargé si valide
#  — sinon la config précédente est restaurée, sans reload. Commande manuelle
#  équivalente (dépannage uniquement) :
#    cp /opt/neurones-ia/nginx.neurones-ia.conf /etc/nginx/sites-available/neurones-ia
#    ln -sf /etc/nginx/sites-available/neurones-ia /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#
#  Routage /api/* — deux familles de routes distinctes sous le même préfixe :
#    - /api/copilot, /api/backend/*, et tout le reste de /api/* (auth, chat...) :
#      Route Handlers Next.js (server-side, injectent le JWT httpOnly avant
#      d'appeler FastAPI) → doivent atterrir sur le FRONTEND (3001), jamais
#      sur FastAPI directement (sinon 404, ces routes n'existent pas côté
#      FastAPI sans le préfixe /v1 — bug réel rencontré : login en prod
#      renvoyait 404 car le catch-all envoyait /api/auth/login vers FastAPI).
#    - /api/v1/*  (webhooks Odoo, etc.) : appelé directement par des systèmes
#      externes (pas de passage par le navigateur) → proxy direct FastAPI,
#      avec réécriture qui retire le préfixe /api. Prefix locations nginx :
#      le préfixe le plus long l'emporte, donc /api/v1/ prime sur /api/ quel
#      que soit son ordre dans le fichier.
# ============================================================

server {
    server_name nt-cockpit.neuronestech.com ia.neuronestech.com _;

    client_max_body_size 50M;

    # Route Handler Next.js (Sales IA / copilot) — AbortSignal.timeout(120s) côté route.ts.
    location /api/copilot {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }

    # Route Handler Next.js (proxy avant-vente + GED) — PROXY_TIMEOUT_MS = 600s côté route.ts.
    location /api/backend/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 610s;
        proxy_send_timeout 610s;
    }

    # Appels DIRECTS à FastAPI (webhooks Odoo, etc. — pas de navigateur impliqué).
    location /api/v1/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Reste de /api/* (auth, chat, ...) : autres Route Handlers Next.js — doivent
    # atterrir sur le FRONTEND, pas sur FastAPI (sinon 404, /v1 manquant).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;

        # Les pages cockpit streament leur HTML : la coque et les chiffres
        # partent immédiatement, les narrations LLM (frontières <Suspense>,
        # cf. components/ui/analysis-slot.tsx) se posent ensuite. Sans ces deux
        # directives nginx tamponne la réponse et ne la relâche qu'une fois
        # COMPLETE — l'utilisateur retrouve alors l'attente de 12 à 18 s que le
        # streaming supprime, alors que le frontend fait déjà le bon travail.
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nt-cockpit.neuronestech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nt-cockpit.neuronestech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = nt-cockpit.neuronestech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name nt-cockpit.neuronestech.com ia.neuronestech.com _;
    return 404; # managed by Certbot


}
