name: Build & Deploy Neurones IA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/neurones-technologies/neurones-ia-backend
  FRONTEND_IMAGE: ghcr.io/neurones-technologies/neurones-ia-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # ─── Sync nginx config : test avant reload, restore si invalide ──────
      - name: Upload nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          source: "nginx.neurones-ia.conf,docker-compose.yml"
          target: "/opt/neurones-ia"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Nginx : backup, test, reload — restore automatique si config invalide.
            cp /etc/nginx/sites-available/neurones-ia /etc/nginx/sites-available/neurones-ia.bak-predeploy
            cp /opt/neurones-ia/nginx.neurones-ia.conf /etc/nginx/sites-available/neurones-ia
            if nginx -t; then
              systemctl reload nginx
              echo "Nginx rechargé."
            else
              cp /etc/nginx/sites-available/neurones-ia.bak-predeploy /etc/nginx/sites-available/neurones-ia
              echo "ERREUR nginx -t — configuration précédente restaurée, PAS de reload."
              exit 1
            fi

            cd /opt/neurones-ia
            IMAGE_TAG="$IMAGE_TAG" docker compose pull backend frontend
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d
            echo "$IMAGE_TAG" > .deployed_tag

            # Le backend charge son modèle d'embeddings au démarrage — c'est
            # pourquoi docker-compose lui accorde start_period: 60s. Un `sleep 15`
            # suivi d'un unique curl marquait donc le déploiement en échec par
            # intermittence alors que le site tournait (curl exit 56, backend
            # encore en train de démarrer). On attend jusqu'à 90s, en sortant dès
            # la première réponse.
            for i in $(seq 1 45); do
              if curl -sf http://localhost:8000/v1/health > /dev/null; then
                echo "Backend sain (après $((i * 2))s)."
                break
              fi
              if [ "$i" -eq 45 ]; then
                echo "Le backend n'a pas répondu sur /v1/health après 90s :"
                docker compose logs --tail 50 backend
                exit 1
              fi
              sleep 2
            done

            for i in $(seq 1 15); do
              if curl -sf -o /dev/null http://localhost:3001/; then
                echo "Frontend sain (après $((i * 2))s)."
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "Le frontend n'a pas répondu après 30s :"
                docker compose logs --tail 50 frontend
                exit 1
              fi
              sleep 2
            done

            # Nettoyage après validation seulement : `docker image prune -f` ne
            # touche pas les images taguées, donc chaque SHA déployé restait sur
            # le disque (~3 GB par version de backend). On supprime les anciens
            # tags des deux images, puis les couches orphelines.
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E '^ghcr\.io/neurones-technologies/neurones-ia-(backend|frontend):' \
              | grep -v ":$IMAGE_TAG$" \
              | xargs -r docker rmi || true
            docker image prune -f
